<!DOCTYPE html>
<html lang="id">
<head>

  <title>Halaman Tidak Ditemukan (404) — NutriSmart</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script>document.documentElement.dataset.theme = localStorage.getItem('ns_theme') || 'light';</script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 40%, rgba(15, 157, 99, 0.08), transparent 60%), var(--bg);
    }
    .nf-box {
      max-width: 480px;
      background: var(--surface-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);

    .nf-code {
      font-size: 72px;

      line-height: 1;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

    }
    .nf-box h1 {

      margin-bottom: 10px;
    }
    .nf-box p {
      font-size: 14.5px;
      color: var(--text-2);
